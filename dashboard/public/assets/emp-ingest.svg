    <ellipse cx="90" cy="70" rx="34" ry="36" fill="url(#skin)"/>
    <path d="M58 58 Q90 28 122 58 L118 70 Q90 48 62 70 Z" fill="#2f3a2e"/>
    <circle cx="78" cy="72" r="4" fill="#1c2430"/>
    <circle cx="102" cy="72" r="4" fill="#1c2430"/>
    <path d="M80 88 Q90 96 100 88" fill="none" stroke="#1c2430" stroke-width="2" stroke-linecap="round"/>
    <!-- badge -->
    <rect x="68" y="155" width="44" height="16" rx="4" fill="#c45c26"/>
    <text x="90" y="167" text-anchor="middle" fill="#fff" font-size="10" font-family="sans-serif" font-weight="700">INGEST</text>
