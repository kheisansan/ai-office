<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 260" role="img" aria-label="取り込み担当">
  <defs>
    <linearGradient id="bodyG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a8f88"/>
      <stop offset="100%" stop-color="#0d5f5a"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0d0b4"/>
      <stop offset="100%" stop-color="#d9a888"/>
    </linearGradient>
    <filter id="ch">
      <feDropShadow dx="4" dy="8" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  <ellipse cx="90" cy="248" rx="52" ry="10" fill="#1c2430" opacity="0.2"/>
  <g filter="url(#ch)">
    <!-- legs isometric-ish -->
    <path d="M68 175 L82 175 L78 235 L62 235 Z" fill="#1c2430"/>
    <path d="M98 175 L112 175 L118 235 L102 235 Z" fill="#2a3340"/>
    <!-- torso with depth -->
    <path d="M55 105 L90 95 L125 105 L118 180 L62 180 Z" fill="url(#bodyG)"/>
    <path d="M125 105 L135 112 L125 185 L118 180 Z" fill="#0a4a46"/>
    <rect x="72" y="118" width="36" height="32" rx="5" fill="#d9ebe8" opacity="0.9"/>
    <!-- arms -->
    <path d="M55 115 L42 155 L55 160 L62 125 Z" fill="#1a8f88"/>
    <path d="M125 115 L148 145 L138 155 L118 125 Z" fill="#0d5f5a"/>
