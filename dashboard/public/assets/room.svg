<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-label="AI Office 2.5D quarter view">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7eb8c9"/>
      <stop offset="55%" stop-color="#c5dce3"/>
      <stop offset="100%" stop-color="#e8dcc8"/>
    </linearGradient>
    <linearGradient id="floorShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b7c9b8"/>
      <stop offset="100%" stop-color="#8fa392"/>
    </linearGradient>
    <linearGradient id="wallL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#efe6d6"/>
      <stop offset="100%" stop-color="#d5c7b0"/>
    </linearGradient>
    <linearGradient id="wallR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2d5c2"/>
      <stop offset="100%" stop-color="#c4b49c"/>
    </linearGradient>
    <linearGradient id="woodTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9956a"/>
      <stop offset="100%" stop-color="#a67245"/>
    </linearGradient>
    <linearGradient id="woodSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5a35"/>
      <stop offset="100%" stop-color="#6e4528"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a9b94"/>
      <stop offset="100%" stop-color="#0d5c58"/>
    </linearGradient>
    <pattern id="isoTile" width="64" height="32" patternUnits="userSpaceOnUse" patternTransform="translate(600 420)">
      <path d="M32 0 L64 16 L32 32 L0 16 Z" fill="#9eb5a0" stroke="#7d947f" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#1c2430" flood-opacity="0.22"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- atmosphere -->
  <rect width="1200" height="780" fill="url(#sky)"/>
  <ellipse cx="980" cy="120" rx="160" ry="50" fill="#fff6e0" opacity="0.45" filter="url(#glow)"/>

  <!-- room box (quarter view) -->
  <!-- left wall -->
  <path d="M180 210 L600 90 L600 390 L180 510 Z" fill="url(#wallL)"/>
  <!-- right wall -->
  <path d="M600 90 L1020 210 L1020 510 L600 390 Z" fill="url(#wallR)"/>
  <!-- floor -->
  <path d="M180 510 L600 390 L1020 510 L600 630 Z" fill="url(#floorShade)"/>
  <path d="M180 510 L600 390 L1020 510 L600 630 Z" fill="url(#isoTile)" opacity="0.55"/>

  <!-- windows on left wall -->
  <g opacity="0.9">
    <path d="M260 250 L420 200 L420 310 L260 360 Z" fill="#9fd0e0" stroke="#6a8f9a" stroke-width="3"/>
    <path d="M280 265 L400 228" stroke="#fff" stroke-width="2" opacity="0.5"/>
    <path d="M250 380 L410 330 L410 420 L250 470 Z" fill="#9fd0e0" stroke="#6a8f9a" stroke-width="3"/>
  </g>

  <!-- brand sign (back corner) -->
  <g filter="url(#soft)">
    <path d="M520 140 L680 140 L700 165 L500 165 Z" fill="#1c2430"/>
    <path d="M500 165 L700 165 L690 180 L510 180 Z" fill="#0f161e"/>
    <text x="600" y="162" text-anchor="middle" fill="#f3efe6" font-family="Georgia, serif" font-size="26" font-weight="700">AI Office</text>
  </g>

  <!-- REVIEW board (left-forward) -->
  <g filter="url(#soft)">
    <path d="M250 430 L380 390 L400 430 L270 470 Z" fill="#2a3340"/>
    <path d="M270 470 L400 430 L400 455 L270 495 Z" fill="#1a222c"/>
    <path d="M265 445 L385 408 L385 455 L265 492 Z" fill="#eef3f6"/>
    <text x="325" y="455" text-anchor="middle" fill="#1c2430" font-family="sans-serif" font-size="14" font-weight="700">REVIEW</text>
  </g>

  <!-- wall monitor (right) -->
  <g filter="url(#soft)">
    <path d="M820 300 L960 345 L960 430 L820 385 Z" fill="#1c2430"/>
    <path d="M835 320 L945 355 L945 410 L835 375 Z" fill="url(#screen)"/>
    <text x="890" y="375" text-anchor="middle" fill="#e8fff8" font-family="sans-serif" font-size="13" font-weight="600">QUEUE</text>
  </g>

  <!-- desk left (ingest) isometric -->
  <g filter="url(#soft)">
    <ellipse cx="380" cy="575" rx="95" ry="22" fill="#1c2430" opacity="0.18"/>
    <path d="M300 520 L420 480 L500 520 L380 560 Z" fill="url(#woodTop)"/>
    <path d="M300 520 L380 560 L380 585 L300 545 Z" fill="url(#woodSide)"/>
    <path d="M380 560 L500 520 L500 545 L380 585 Z" fill="#7a4e2e"/>
    <!-- monitor -->
    <path d="M360 470 L420 450 L430 475 L370 495 Z" fill="#2c3a44"/>
    <path d="M368 475 L418 458 L422 472 L372 489 Z" fill="#6ec4bc"/>
  </g>

  <!-- desk right (ask) isometric -->
  <g filter="url(#soft)">
    <ellipse cx="780" cy="575" rx="95" ry="22" fill="#1c2430" opacity="0.18"/>
    <path d="M700 520 L820 480 L900 520 L780 560 Z" fill="url(#woodTop)"/>
    <path d="M700 520 L780 560 L780 585 L700 545 Z" fill="url(#woodSide)"/>
    <path d="M780 560 L900 520 L900 545 L780 585 Z" fill="#7a4e2e"/>
    <path d="M760 470 L820 450 L830 475 L770 495 Z" fill="#2c3a44"/>
    <path d="M768 475 L818 458 L822 472 L772 489 Z" fill="#8eb4d4"/>
  </g>

  <!-- plant -->
  <g>
    <ellipse cx="560" cy="560" rx="18" ry="8" fill="#1c2430" opacity="0.15"/>
    <path d="M548 560 L572 560 L568 530 L552 530 Z" fill="#a67c52"/>
    <ellipse cx="560" cy="515" rx="28" ry="18" fill="#3d7a4a"/>
    <ellipse cx="545" cy="505" rx="14" ry="10" fill="#4f9a5c"/>
    <ellipse cx="575" cy="508" rx="12" ry="9" fill="#2f6b3c"/>
  </g>
</svg>
